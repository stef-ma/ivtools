[project]
name = "ivtools"
version = "0.5.0"
description = "Tools for processing IV data acquired from the LabActor environment used at NHMFL."
authors = [{name = "Stefan Marinkovic"}]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.19",
    "pandas>=1.1", 
    "scipy>=1.5",
    "statsmodels>=0.12",
    "nptdms>=1.3",
    # Notebook essentials
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "ipywidgets>=7.6",  # Interactive widgets
    "matplotlib>=3.2",  # Plotting
    "tqdm>=4.60",       # Progress bars
]

[project.urls]
Repository = "https://github.com/stef-ma/ivtools"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
